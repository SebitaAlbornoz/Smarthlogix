server {
    listen 80;
    server_name _;

    root /var/www/smartlogix-frontend;
    index index.html;

    # SPA: cualquier ruta que no sea archivo real, cae a index.html
    location / {
        try_files $uri /index.html;
    }

    # Todo lo que el frontend llama como /api/... se reenvía al backend
    # privado por la red interna de la VPC (nunca sale a internet).
    # Reemplaza IP_PRIVADA_BACKEND por la IP privada real del backend.
    location /api/ {
        proxy_pass http://IP_PRIVADA_BACKEND:8089/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
